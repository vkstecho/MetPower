<!-- Firebase SDK (Head for early init) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, get, onValue, push, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  import { getAuth, signInWithCustomToken, signInAnonymously, signOut, onAuthStateChanged, signInWithPhoneNumber, RecaptchaVerifier } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js";
  import { getStorage, ref as storageRef, uploadString, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAG3xE_Bfj7VuA3hg5ClUAKUy7S6TNExGs",
    authDomain: "metpowervks.firebaseapp.com",
    databaseURL: "https://metpowervks-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "metpowervks",
    storageBucket: "metpowervks.firebasestorage.app",
    messagingSenderId: "953633730980",
    appId: "1:953633730980:web:3b5dfc28f0d8778cb3d131"
  };

  try{
    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);
    const auth = getAuth(app);
    const functions = getFunctions(app);
    const _fbStore = { db, ref, set, get, onValue, push, update, remove };
    window._fbAccess = async function(op, path, val){
      if(op !== 'get' && op !== 'onValue' && !auth.currentUser){
        try{ await signInAnonymously(auth); }catch(e){ console.warn('[fbAccess] re-auth failed:', e.message); }
      }
      const _sessionCheck = ()=>{
        try{ return !!(localStorage.getItem('mp_session') || sessionStorage.getItem('mp_session_bak') || auth.currentUser); }catch(e){ return false; }
      };
      if(!_sessionCheck() && op !== 'get' && op !== 'onValue'){
        return Promise.reject(new Error('Not authenticated'));
      }
      const r = ref(db, path);
      switch(op){
        case 'get': return get(r);
        case 'set': return set(r, val);
        case 'push': return push(r, val);
        case 'update': return update(r, val);
        case 'remove': return remove(r);
        case 'onValue': return onValue(r, val);
        default: return Promise.reject(new Error('Invalid op'));
      }
    };
    window._fbAuth = auth;
    window._fbSignInWithToken = (token) => signInWithCustomToken(auth, token);
    window._fbSignInAnon = () => signInAnonymously(auth);
    window._fbSignOut = () => signOut(auth);
    window._fbSendOTP = async function(phoneNumber){
      try{
        if(!window._fbRecaptcha){
          window._fbRecaptcha = new RecaptchaVerifier(auth, 'recaptcha-container', {
            size: 'invisible',
            callback: ()=>{},
            'expired-callback': ()=>{ window._fbRecaptcha = null; }
          });
        }
        const confirmResult = await signInWithPhoneNumber(auth, phoneNumber, window._fbRecaptcha);
        window._fbConfirmOTP = (code) => confirmResult.confirm(code);
        return { success: true };
      }catch(e){
        window._fbRecaptcha = null;
        return { success: false, error: e.message, code: e.code };
      }
    };
    window._fbCall = (name, data) => httpsCallable(functions, name)(data);
    window._fbReady = true;
    const _storage = getStorage(app);
    window._fbUploadSelfie = async function(base64Data, path){
      try{
        const sr = storageRef(_storage, path);
        await uploadString(sr, base64Data, 'data_url');
        return await getDownloadURL(sr);
      }catch(e){
        return null;
      }
    };
    document.dispatchEvent(new Event('firebase-ready'));
  }catch(e){ console.error('Firebase init error:',e); }
</script>

<!-- BOOTSTRAPPER BRIDGE -->
<script>
  window._bootState = { fb: false, scripts: false };
  function _tryLaunch(){
    if(window._bootState.fb && window._bootState.scripts){
      console.log('[BOOT] Ready to launch');
      if(window.launchApp) window.launchApp();
    }
  }
  document.addEventListener('firebase-ready', () => { window._bootState.fb = true; _tryLaunch(); });
  window.addEventListener('scripts-ready', () => { window._bootState.scripts = true; _tryLaunch(); });
  
  // Hard fallback: Force show loader hide after 5s
  setTimeout(() => {
    const ls = document.getElementById('loadingScreen');
    if(ls) ls.style.display = 'none';
  }, 5000);
</script>

<script>
// PWA Install Logic
let _pwaPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  _pwaPrompt = e;
  if (!window.matchMedia('(display-mode: standalone)').matches) {
    document.getElementById('pwaBanner').style.display = 'flex';
  }
});

function triggerPWAInstall() {
  if (_pwaPrompt) {
    _pwaPrompt.prompt();
    _pwaPrompt.userChoice.then((choiceResult) => {
      if (choiceResult.outcome === 'accepted') {
        document.getElementById('pwaBanner').style.display = 'none';
      }
      _pwaPrompt = null;
    });
  } else {
    // Fallback for iOS/Safari or browsers not supporting beforeinstallprompt
    alert("To install the app:\n- On iOS: Tap the Share icon, then select 'Add to Home Screen'.\n- On Android: Use browser menu 'Install App' or 'Add to Home Screen'.");
  }
}

// Show banner on iOS if not in standalone mode as it doesn't fire beforeinstallprompt
if (!window.matchMedia('(display-mode: standalone)').matches && /iPhone|iPad|iPod/.test(navigator.userAgent)) {
  document.getElementById('pwaBanner').style.display = 'flex';
}

// Logic Optimization

async function initData(){
  // ── OPTIMIZATION: Fetch initial state in parallel with listeners ──
  // Use a timeout to prevent hanging on slow DB
  const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('DB_TIMEOUT')), 5000));
  
  try {
    await Promise.race([
      (async () => {
        const [emps, lvs, rpts, svs, regs] = await Promise.all([
          fbGet('employees'),
          fbGet('leaves'),
          fbGet('reports'),
          fbGet('settings'),
          fbGet('regRequests')
        ]);
        
        if(emps) _cache.employees = Object.values(emps);
        if(lvs) _cache.leaves = Object.values(lvs);
        if(rpts) _cache.reports = Object.entries(rpts).map(([k,r])=>({...r, _key: k}));
        if(svs) _cache.settings = svs;
        if(regs) _cache.regRequests = Object.values(regs);
        
        // Initial render done - app feels "open"
        console.log('[INIT] Baseline data loaded');
      })(),
      timeout
    ]);
  } catch(e) {
    console.warn('[INIT] Initial fetch failed or timed out, relying on listeners');
  }

  // ── BACKGROUND LISTENERS (Same as before but non-blocking) ──
  fbListen('employees', v => { _cache.employees = v ? Object.values(v) : []; refreshAll(); });
  fbListen('leaves', v => { _cache.leaves = v ? Object.values(v) : []; refreshAll(); });
  fbListen('reports', v => { _cache.reports = v ? Object.entries(v).map(([k,r])=>({...r, _key: k})) : []; refreshAll(); });
  fbListen('settings', v => { _cache.settings = v || {}; });
  fbListen('regRequests', v => { _cache.regRequests = v ? Object.values(v) : []; refreshAll(); });
}

// Ensure scripts-ready is dispatched at the very end
window.dispatchEvent(new Event('scripts-ready'));
</script>
